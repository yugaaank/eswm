name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm \
            base-devel \
            git \
            rust \
            libdrm \
            mesa \
            wayland \
            wayland-protocols \
            libinput \
            libxcursor \
            libxkbcommon \
            pkgconf

      - name: Install libseat from AUR
        run: |
          git clone https://aur.archlinux.org/libseat.git /tmp/libseat
          (cd /tmp/libseat && makepkg -si --noconfirm --needed)

      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test
