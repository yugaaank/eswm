name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm \
            base-devel \
            git \
            rust \
            libdrm \
            pixman \
            mesa \
            wayland \
            wayland-protocols \
            libinput \
            libxcursor \
            libxkbcommon \
            pkgconf

      - name: Install libseat from Arch repos (seatd provides libseat.pc)
        run: pacman -S --noconfirm seatd

      - name: Install spec tooling
        run: pacman -S --noconfirm python python-yaml

      - name: Lint specs
        run: python3 scripts/spec-lint.py

      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test
