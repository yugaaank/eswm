[package]
name = "eswm"
version = "0.1.0"
edition = "2024"

[dependencies]
smithay = { version = "0.7", features = ["backend_egl", "use_system_lib"] }
winit = { version = "0.30", features = ["x11"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-server = "0.31"
wayland-protocols = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
flume = "0.11"
mlua = { version = "0.12", features = ["lua54"] }
smithay-drm-extras = "0.1.0"
xcursor = "0.3"
xkbcommon = "0.8"

[dev-dependencies]
wayland-client = "0.31.15"
