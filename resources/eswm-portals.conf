# eswm portal selection.
#
# Install as /usr/share/xdg-desktop-portal/eswm-portals.conf. eswm identifies
# itself as XDG_CURRENT_DESKTOP=eswm, so xdg-desktop-portal looks for this file.
#
# GTK is the conservative default: it covers file choosers, URI opening and
# settings without claiming capture interfaces eswm does not implement yet.
# Capture interfaces are deliberately absent until a later phase adds a
# capture protocol; a client asking for them gets no backend from us.
[preferred]
default=gtk
org.freedesktop.portal.FileChooser=gtk
org.freedesktop.portal.OpenURI=gtk
org.freedesktop.portal.Settings=gtk
