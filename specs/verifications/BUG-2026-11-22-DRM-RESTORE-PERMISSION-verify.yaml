causal_proof:
  type: static-source-reading-plus-unit-truth-table
  not_runtime_proof: true
  bug_symptom: >-
    ERROR "Failed to restore previous state. Error: Permission denied (os
    error 13)" once per card, immediately before "Dropping device" at graceful
    quit (live log 2026-11-22T10:50:04Z).
  smithay_guard: "atomic.rs:240 — drop restores only if self.active.load(SeqCst)"
  smithay_pause: "mod.rs:419 — DrmDevice::pause() calls set_active(false)"
  eswm_old_path: >-
    run_udev() returned at udev.rs:850 with devices still active; state drop
    reached AtomicDrmDevice::drop with the guard true.
  eswm_new_path: >-
    Drop for UdevData calls quiesce_unprivileged over every backend; only cards
    with drm_master == false are paused, clearing smithay's guard before drop.
  privileged_safety: >-
    A card that acquired master at open is left active: its restore succeeds
    and InternalDrmDeviceFd::drop releases master exactly once. This avoids
    both the black-screen risk and a second drmDropMaster ERROR.
  unprivileged_evidence: >-
    fd.rs:77-80 warns once per card at startup; live log 10:49:54Z and
    10:49:56Z show both warnings.
  status: passed_as_static_argument
hardening:
  mechanism: "per-card drm_master recording + Drop guard + FakeBackend truth table"
  reason: >-
    A global paused flag cannot represent a card hot-added after PauseSession,
    and unconditional pausing regresses privileged TTY quits. Per-card state
    and a Drop guard cover both.
  tested: true
generalize_sweep:
