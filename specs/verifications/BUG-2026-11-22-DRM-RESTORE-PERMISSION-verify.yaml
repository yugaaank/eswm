causal_proof:
  bug_symptom: >-
    ERROR "Failed to restore previous state. Error: Permission denied (os
    error 13)" once per card, immediately before "Dropping device" at graceful
    quit (live log 2026-11-22T10:50:04Z).
  smithay_guard: "atomic.rs:240 — drop restores only if self.active.load(SeqCst)"
  smithay_pause: "mod.rs:419 — DrmDevice::pause() calls set_active(false)"
  eswm_old_path: >-
    run_udev() returned at udev.rs:850 with devices still active; state drop
    reached AtomicDrmDevice::drop with the guard true.
  eswm_new_path: >-
    quiesce_all(backends.values_mut(), paused) at udev.rs:854 runs after the
    loop and before state drop; DrmOutputManager::pause() delegates to
    DrmDevice::pause(), clearing the guard.
  unprivileged_evidence: >-
    fd.rs:77-80 warns once per card at startup; live log 10:49:54Z and
    10:49:56Z show both warnings.
  skipped_restore_is_correct: >-
    The restore cannot succeed in an unprivileged session by construction;
    suppressing the impossible ioctl removes ERROR noise with no functional
    change. libseat release still happens on session teardown.
  status: passed
hardening:
  mechanism: "session_paused policy guard + FakeBackend truth-table tests"
  reason: >-
    SessionEvent::PauseSession already pauses and releases master. A second
    pause on a privileged device would call release_master_lock() twice and
    log a different ERROR.
  tested: true
