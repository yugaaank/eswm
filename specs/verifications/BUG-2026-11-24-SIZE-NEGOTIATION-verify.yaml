gates:
  failing_test_replay:
    passed: true
    tests:
      - id: fill_scale_grows_an_undersized_buffer_to_the_frame
        command: "cargo test --bin eswm fill_scale"
        result: "4 passed (with size_ and surface_under filters)"
        note: >-
          RED before the fix: fill_scale() did not exist, so the test binary
          failed to compile. GREEN: target 800x600 / buffer 640x480 yields
          (1.25, 1.25); oversized buffers scale down; exact/invalid are neutral.
      - id: scaled_element_stretches_geometry_to_the_frame
        command: "cargo test --bin eswm scaled_element"
        result: "2 passed"
        note: >-
          RED before the fix: ScaledElement did not exist. GREEN: a 1440x900
          element stretched to 1896x1078 reports the frame geometry while
          keeping the buffer source rect; damage/opaque regions scale too.
      - id: surface_under_inverts_fill_scale_for_input_regions
        command: "cargo test --bin eswm surface_under"
        result: "2 passed"
        note: >-
          RED before the fix: surface_under used the raw render origin, so
          clicks on a stretched client missed input regions. GREEN: coordinates
          are divided by the stretch before the input-region hit test.
      - id: size_action_resends_when_the_buffer_is_undersized
        command: "cargo test --bin eswm size_"
        result: "15 passed"
        note: >-
          Cycle-1 regression gate: a mismatch in either direction asks for a
          configure, only an exact match resets the budget, and resends inside
          the 100 ms burst window are throttled.
      - id: size_resend_budget_is_bounded
        command: "cargo test --bin eswm size_"
        result: "15 passed"
  clip_finding:
    passed: true
    verdict: not_a_defect
    command: "cargo test --bin eswm clip_"
    note: >-
      The reported clip-vs-xdg_offset mismatch was re-checked against
      clip_offsets_src_when_geometry_starts_before_clip and the damage/opaque
      coordinate tests. The clip rect is the window-geometry rect in output
      space and the surface renders at target_rect - xdg_offset, so CSD content
      lands exactly on the clip origin; only decoration outside the frame is
      trimmed. No production change; module doc records the anchoring.
  composition_proof:
    passed: true
    command: "cargo test --bin eswm clip_ && cargo test --bin eswm scaled_element"
    note: >-
      ClippedElement wraps ScaledElement: src() recomputes the source crop from
      the stretched geometry, so the full 1440x900 texture maps to the enlarged
      1896x1078 destination (no crop, no letterbox). underlying_storage() stays
      None on both wrappers, forcing the texture path and blocking direct
      scanout from bypassing the stretch.
