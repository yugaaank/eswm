driver_table_proof:
  passed: true
  method: >-
    Direct eglQueryDmaBufFormatsEXT / eglQueryDmaBufModifiersEXT probe against
    every /dev/dri node from this session (no TTY or VT grab). Throwaway probe at
    /tmp/opencode/ab24_probe.c; query is read-only on the driver's advertised
    format tables.
  ab24_modifier_under_test: "0x300000000606014 (vendor 3 = NVIDIA)"
  results:
    - node: renderD128 / card1 (Intel scanout)
      ab24: present
      target_modifier: "NOT found (only vendor-1 Intel modifiers 0x0, 0x1000...)"
    - node: renderD129 / card0 (NVIDIA)
      ab24: present
      target_modifier: "FOUND at mod[4] of 13 NVIDIA modifiers"
  conclusion: >-
    Only the NVIDIA GPU advertises AB24 with the baseline's NVIDIA modifier.
    dmabuf_sources retains both GPUs' full FormatSets (scanout first), so an
    AB24 buffer with this modifier can match only the NVIDIA source.
    dmabuf_source_node therefore returns the NVIDIA node and the import is
    routed to NVIDIA EGL first, where it succeeds without a BAD_MATCH on Intel.
    This is the exact causal chain the fix repairs; it does not depend on the
    client reallocating the buffer during UAT.
