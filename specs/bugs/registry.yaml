    - specs/bugs/BUG-2026-11-22-XDG-ACTIVATION-GLOBAL.md
  description: |
    Spawn log repeatedly reports "Unable to mint xdg activation token to
    launch ..." for deckcraft, helium and other apps. eswm did not advertise
    the xdg_activation_v1 global, so clients fell back to unactivated launches.
  what_expected: |
    Compositor advertises xdg_activation_v1 so client windows arrive with
    proper focus/activation semantics.
