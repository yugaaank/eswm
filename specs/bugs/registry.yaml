bug-2026-11-16t17:30:00:
  id: bug-2026-11-16t17:30:00
  title: Idle CPU at ~55% due to unthrottled frame callbacks
  severity: low
  status: resolved
  reported_by: operator_observation
  fixed_in: 02f57d2
  fixed_date: "2026-11-17T19:10:00+05:30"
  files:
    - src/main.rs
    - src/udev.rs
  description: |
    eswm idle CPU is ~55% (one core pegged, rising over time) and RSS is ~286 MB growing,
    vs Hyprland's 1.9% / 84 MB flat. Memory is stable (VmHWM == RSS). It is not a leak. It is
    a hot loop keeping one core busy and accumulating resident pages.
    A client like waybar that requests a frame callback after each commit enters a
    commit/frame-callback loop: client commits, eswm renders and sends a frame callback,
    client commits again, repeat at ~60 Hz. Each iteration sets redraw_needed = true, so
    the render loop never idles.
  fix_plan: |
    1. Add last_frame_callback_ms to State, initialized to 0.
    2. In frame_callbacks, compare time against last_frame_callback_ms; if elapsed < 33 ms,
       return early without sending callbacks. Update last_frame_callback_ms = time when
       sending.
    3. Verify idle CPU drops toward Hyprland levels (~0-2%).
  verify: |
    cargo test; cargo build; measure idle CPU on bare TTY with waybar running.

bug-2026-11-16t17:45:54:
  id: bug-2026-11-16t17:45:54
  title: Idle CPU 80-93% from unconditional vblank re-render timer
  severity: low
  status: resolved
  reported_by: operator_observation
  fixed_in: 8902405
  fixed_date: "2026-11-17T19:10:00+05:30"
  files:
    - src/udev.rs
  description: |
    eswm uses 80-93% CPU while idle (no clients, no input), RSS 287 MB. Hyprland idles at 0% CPU / 84 MB.
    The prior fix (frame callback throttle to ~30fps) did not stop the render loop.
    The actual driver is frame_finish in the DRM backend, which unconditionally
    schedules a calloop timer after every queue_frame, creating a continuous
    ~60fps render loop that bypasses the redraw_needed gate in the main event loop.
  fix_plan: |
    In frame_finish, guard the timer-scheduling block with if !self.redraw_needed { return; }.
    Only reschedule when something actually needs redrawing.
  verify: |
    cargo test; cargo build; measure idle CPU on bare TTY.

bug-2026-11-17t00:30:00:
  id: bug-2026-11-17T00:30:00
  title: Stutter/freeze when the cursor is still; a dropped frame callback deadlocks the client
  severity: high
  status: fixed
  reported_by: operator_observation
  fixed_in: 02f57d2
  fixed_date: "2026-11-17T19:10:00+05:30"
  risk_level: medium
  files:
    - src/udev.rs
    - src/main.rs
  description: |
    After the vblank-timer fix, idle CPU fell to 14-16% but the desktop still
    stuttered, and later froze completely: whole screen, cursor included, until
    the pointer moved. Five defects sat on top of each other and each hid the
    next — an unpaced render loop, empty frames counted as failed paints, dmabuf
    feedback advertising the idle dGPU, frame callbacks gated on two different
    clocks, and finally a frame callback dropped as "too soon".
  resolution: |
    A frame callback is the client's permission to draw. Dropping it does not
    delay the client, it blocks it: it already committed and has nothing left to
    do. No commits means no damage, no flip and therefore no callback — a
    self-sustaining deadlock. No flip also means no atomic commit, which is what
    moves the cursor plane, so the pointer froze too; moving it forced a present
    and broke the loop, exactly as reported.
    Pacing is done by the one-frame-in-flight gate, so pending callbacks are now
    delivered on every present. Render loop gated on frame_in_flight; empty
    frames satisfy the redraw request instead of retrying; dmabuf device taken
    from the scanout GPU; callback time from now(self) only.
  approach: |
    Two-commit TDD per defect (test then fix), plus a hardening pass that fixed
    PointerMotionAbsolute, which updated the pointer location without requesting
    a redraw — the same class of defect (silently not requesting the flip the
    user is waiting on), untestable without a fake InputBackend.
  commits:
    - 8902405
    - fc52ecf
    - 51260d3
    - b613102
    - 80a8e0a
    - b0fc67f
    - 02f57d2
    - 2ac8dc4
    - be0f2bd
    - 6922ccc
  verify: |
    cargo clippy && cargo test && cargo build --release (72/72, 0 clippy errors).
    Live DRM session: no freezes with the pointer still, operator confirmed.
    Operator confirmed idle CPU near zero and RSS down after 02f57d2; the loop
    was allocating a frame's buffers 60 times a second with nothing damaged.
    Watch for "presented N ms after commit|input (late)" and
    "frame gap N ms had work waiting" in ~/.local/state/eswm/eswm.log — both
    must stay at zero during normal desktop use.

e001-key-logging:
  id: e001
  title: Key presses (including passwords) logged to world-readable /tmp/eswm.log
  severity: critical
  status: resolved
  reported_by: external_review
  fixed_in: 751630b
  fixed_date: "2026-11-15T16:27:28+05:30"
  files:
    - src/main.rs
    - src/udev.rs
  description: |
    process_shortcut (udev.rs:773) logged every key press via tracing::info!,
    including modifier state and raw keysym. This ran on every key press from
    the keyboard filter, including presses forwarded to clients. The default
    filter was info, so the log was written by default. The file was created at
    /tmp/eswm.log with default mode 0644, readable by other users. Every
    password typed in a session landed in a world-readable file.
  fix_plan: |
    1. Delete the key-press logging line in udev.rs (never log keysyms/text above trace).
    2. Move log file to $XDG_STATE_HOME/eswm/eswm.log with mode 0600.
    3. Rename previous log to eswm.log.old instead of truncating.
    4. Move layer-mapped debug line from per-commit to layer creation.
  verify: |
    cargo test; cargo build; confirm no tracing::info! call logs key data;
    confirm log file mode is 0600; confirm log dir is $XDG_STATE_HOME/eswm/

bug-2026-11-17t141711:
  id: bug-2026-11-17t141711
  title: master-mode single-window border breaks at bottom
  severity: low
  status: open
  reported_by: user_report
  risk_level: low
  security_impact: low
  files:
    - src/udev.rs
  description: |
    In master tiling layout with a single tiled window in a workspace, the left
    and right window borders stop short of the bottom border, leaving a visible
    break at the bottom corners. The bottom of the window appears to run out
    past where the side borders end. With multiple windows the same gap exists
    per window but is less noticeable; with one full-height master window the
    discontinuity in a long vertical border is obvious.
  fix_plan: |
    1. Extract border edge position math into a pure testable helper and add a
       unit test asserting left/right edges span full frame height (no gap with
       bottom edge).
    2. Fix side_h to use full frame height (rect.height + 2*border_size +
       titlebar_height) so side borders connect to top and bottom borders.
    3. Replace inline border edge construction in udev.rs with the shared helper.
  verify: |
    cargo test; cargo clippy

bug-2026-11-19t235000:
  id: bug-2026-11-19t235000
  title: titlebar maximize button does not resize the client
  severity: medium
  status: fixed
  reported_by: user_report
  risk_level: low
  security_impact: none
  files:
    - src/udev.rs
    - src/wm.rs
  description: |
    Clicking the maximize button in the server-side titlebar grew the window
    frame (borders + titlebar) to the maximized geometry, but the client surface
    stayed at its previous size inside it. The Super+maximize keybind worked.
  root_cause: |
    The titlebar pointer handler called wm.toggle_maximized / toggle_minimize /
    remove_window directly and never ran apply_layout, which is the only path
    that sends xdg_toplevel.configure and calls wm.set_rect. target_rect was
    updated by arrange_output and rendering reads target_rect, so the frame grew
    around a client that was never configured. No redraw was requested either.
  fix_plan: |
    1. Extract the titlebar button hit test into a pure wm::titlebar_button_at
       helper (with tests) so click routing cannot drift from the renderer.
    2. Add udev::apply_titlebar_action: perform the WM action, then apply_layout
       and request a redraw.
    3. Route the pointer handler through it.
  verify: |
    cargo test titlebar (2 new tests); cargo test 86/86; cargo clippy; cargo build.
    Live check on a DRM session: titlebar maximize resizes the client, not just
    the frame.
  followup: |
    Restore half (same call site class): toggle_maximized's restore branch set
    both rect and target_rect, so apply_layout saw rect == target, skipped the
    configure, and the client stayed maximized inside a shrunken frame. The
    branch now sets target_rect only. Test:
    toggle_maximized_restore_forces_size_configure.

bug-2026-11-18t160939:
  id: bug-2026-11-18t160939
  title: xdg_popup misplaced and input focus stranded after dismissal
  severity: medium
  status: fixed
  reported_by: user_report
  fixed_date: "2026-11-18T17:05:00+05:30"
  risk_level: medium
  security_impact: none
  files:
    - src/main.rs
    - src/udev.rs
  description: |
    Right-click context menus (GTK4 xdg_popup) are placed at the parent window
    origin instead of the cursor because only positioner.offset is applied and
    anchor_rect/anchor/gravity are ignored. Dismissal drops the internal grab
    but never sends xdg_popup.popup_done, popup_destroyed is unimplemented
    (stale popup, stuck grab, keyboard focus never restored), grabbed pointer
    events carry absolute screen coordinates, and reposition requests are never
    acknowledged.
  fix_plan: |
    1. Port Hyprland's positioner rules (anchor point, gravity, offset,
       flip/slide/resize against the work area) as a pure helper with tests.
    2. Use the resolved parent-relative geometry for the initial configure and
       for rendering; recompute per frame so popups follow the parent window.
    3. Store each popup's screen rect; hit-test grabbed popups against it and
       pass popup-local coordinates to the pointer.
    4. Send popup_done and restore the parent window's keyboard focus on
       outside-click dismissal.
    5. Implement popup_destroyed: remove the popup, clear its grab, restore
       focus, redraw.
    6. Acknowledge reposition requests with send_repositioned(token).
    7. Skip server-side borders/titlebars for popup entries; log popup
       geometry/mapped/dismissed at info level.
  verify: |
    cargo test; cargo clippy; cargo build

bug-2026-11-22t123500:
  id: BUG-2026-11-22-OVERSIZE-RETRY-CAP
  title: Oversize size-reassert retry cap resets itself and storms the client
  severity: medium
  status: open
  reported_by: operator_observation
  date: "2026-11-22T12:35:00+05:30"
  priority: medium
  scope: rendering
  security_impact: none
  files:
    - src/main.rs
    - src/wm.rs
  files_changed:
    - src/main.rs
    - src/wm.rs
  risk_level: low
  approach: "Three-outcome OversizeAction policy; reset only on fitting commit"
  commit_message: "refactor(main): exhaustive oversize dispatch prevents silent new actions"
  hardware_uat: pending
  followup: |
    Render-time clipping added after 13:11 run showed Craft apps still spill
    (client ignores 3 configures, commits 1440x900 vs frame 1190x795).
    ClippedSurfaceElement crops src/dst to the configured frame; commits
    b831a9a (test) and e28fc09 (fix). Clippy clean, 165 tests, build green.
    Hardware UAT still required to confirm Craft content stays inside border.
  description: |
    The size-reassert budget resets when the budget is exhausted, not only when
    the client commits a fitting buffer. A stubborn Electron client therefore
    gets a fresh three-try budget after every three oversized commits: 48
    reconfigures for deckcraft and 9 for gridcraft in one 14-second session,
    despite MAX_OVERSIZE_CONFIGURES = 3.
  fix_plan: |
    Split the combined predicate into an explicit policy with three outcomes:
    resend while oversized and budget remains, do nothing while oversized and
    exhausted, and reset the budget only when the buffer fits. Route the commit
    handler through that policy; the old boolean predicate had no remaining
    caller and was removed, with its boundary cases moved to policy tests.
  verify: |
    cargo test --bin eswm oversize_commit_action; cargo clippy; cargo build;
    live DRM run with RUST_LOG=debug and deckcraft/gridcraft, then grep
    're-sending size' in eswm.log.
