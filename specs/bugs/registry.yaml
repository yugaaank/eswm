    2, one per card), 0 'Failed to drop drm master state' lines, 0 ERROR lines in
    the whole log, both cards dropped cleanly and the text TTY came back (the
    shell on that TTY, not a fresh login prompt — expected when eswm is launched
    from an already-logged-in console). Automated proof also green: 183 tests,
    clippy/build clean. Log: ~/.local/state/eswm/eswm.log, session
    19:25:26Z..19:25:51Z.
  followup: >-
    device_removed() (src/udev.rs:2349) still drops an active BackendData on
