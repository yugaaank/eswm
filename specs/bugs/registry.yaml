bug-2026-11-16t17:30:00:
  id: bug-2026-11-16t17:30:00
  title: Idle CPU at ~55% due to unthrottled frame callbacks
  severity: low
  status: open
  reported_by: operator_observation
  fixed_in: ""
  fixed_date: ""
  files:
    - src/main.rs
    - src/udev.rs
  description: |
    eswm idle CPU is ~55% (one core pegged, rising over time) and RSS is ~286 MB growing,
    vs Hyprland's 1.9% / 84 MB flat. Memory is stable (VmHWM == RSS). It is not a leak. It is
    a hot loop keeping one core busy and accumulating resident pages.
    A client like waybar that requests a frame callback after each commit enters a
    commit/frame-callback loop: client commits, eswm renders and sends a frame callback,
    client commits again, repeat at ~60 Hz. Each iteration sets redraw_needed = true, so
    the render loop never idles.
  fix_plan: |
    1. Add last_frame_callback_ms to State, initialized to 0.
    2. In frame_callbacks, compare time against last_frame_callback_ms; if elapsed < 33 ms,
       return early without sending callbacks. Update last_frame_callback_ms = time when
       sending.
    3. Verify idle CPU drops toward Hyprland levels (~0-2%).
  verify: |
    cargo test; cargo build; measure idle CPU on bare TTY with waybar running.

e001-key-logging:
  id: e001
  title: Key presses (including passwords) logged to world-readable /tmp/eswm.log
  severity: critical
  status: resolved
  reported_by: external_review
  fixed_in: 751630b
  fixed_date: "2026-11-15T16:27:28+05:30"
  files:
    - src/main.rs
    - src/udev.rs
  description: |
    process_shortcut (udev.rs:773) logged every key press via tracing::info!,
    including modifier state and raw keysym. This ran on every key press from
    the keyboard filter, including presses forwarded to clients. The default
    filter was info, so the log was written by default. The file was created at
    /tmp/eswm.log with default mode 0644, readable by other users. Every
    password typed in a session landed in a world-readable file.
  fix_plan: |
    1. Delete the key-press logging line in udev.rs (never log keysyms/text above trace).
    2. Move log file to $XDG_STATE_HOME/eswm/eswm.log with mode 0600.
    3. Rename previous log to eswm.log.old instead of truncating.
    4. Move layer-mapped debug line from per-commit to layer creation.
  verify: |
    cargo test; cargo build; confirm no tracing::info! call logs key data;
    confirm log file mode is 0600; confirm log dir is $XDG_STATE_HOME/eswm/
