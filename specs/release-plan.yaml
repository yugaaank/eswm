epics:
  - id: e02
    slug: window-workspace-model
    title: Window and Workspace State Model
    wsjf_rank: 1
    status: completed
    stories: []
    description: |
      Introduce the core window-manager state layer: Window and Workspace
      state models, workspace switching, moving windows between workspaces,
      and integration with the existing master-stack tiler and floating
      windows. Deferred: animations, tiling polish, Tacit integration,
      Xwayland.
  - id: e03
    slug: layout-engine-floating-mode
    title: Layout Engine & Windows 11 Floating Mode
    wsjf_rank: 2
    status: planned
    stories: []
    description: |
      Two distinct compositor modes per output: tiling (master-stack and dwindle
      layouts) and floating (Windows 11 snap behaviour: edge/corner snap,
      drag-to-top maximize, snap restore). Per-output LayoutMode, Super+` layout
      toggle, focus border in DRM render path.
