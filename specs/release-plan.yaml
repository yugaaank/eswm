version: 0.1.0
epics:
  - id: e02
    slug: window-workspace-model
    title: Window and Workspace State Model
    wsjf_rank: 1
    status: completed
    stories: []
    description: |
      Introduce the core window-manager state layer: Window and Workspace
      state models, workspace switching, moving windows between workspaces,
      and integration with the existing master-stack tiler and floating
      windows. Deferred: animations, tiling polish, Tacit integration,
      Xwayland.
  - id: e03
    slug: tiling-layouts-master-equal
    title: Tiling Layouts: Master + Equal
    wsjf_rank: 2
    status: planned
    stories: []
    description: |
      Two tiling layouts per output: master-stack (existing) and equal
      (grid-based equal-sized cells). Per-output TilingLayout field on Output,
      equal wired into arrange_output. Wm mode and tiling layout set via
      es.dsp.set_wm_mode / es.dsp.set_tiling_layout in config.lua.
