core_value: |
  Make resizing a first-class operation in both placement modes. Floating
  windows get all four edges and four corners, with constraints and clear
  input semantics. Tiled windows get draggable split boundaries that survive
  re-arrangement, because per-window rect overrides cannot (arrange_output owns
  tiled geometry).
