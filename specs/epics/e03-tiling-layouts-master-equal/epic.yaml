core_value: |
  eswm provides two tiling layouts per workspace: master-stack and equal
  (grid-based equal-sized cells). Per-workspace layout field; layout switching
  keeps tiling order and each layout's saved state. Wm mode and tiling layout set
  via es.dsp.set_wm_mode / es.dsp.set_tiling_layout in config.lua.
