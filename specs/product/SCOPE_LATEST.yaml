core_value: |
  eswm provides a stable window-manager state model (windows, workspaces, focus)
  so Tacit can manage client windows without depending on Hyprland or another
  compositor. The model separates layout, presentation, visibility, and lifecycle
  into independent axes, with per-workspace layout state and per-output geometry.

summary: |
  Phase 2 introduces the core window-manager state layer on top of the existing
  DRM/compositor foundation (Phase 1 complete). It defines Window and Workspace
  state with independent axes (layout, presentation, visibility, lifecycle),
  per-workspace layout state (master/equal/dwindle), workspace switching, moving
  windows between workspaces, close protocol, and integration with the existing
  master-stack tiler and floating windows. Animations, tiling polish, and Tacit
  native integration are deferred to later phases.

in_scope:
  - Window state model: id, app_id, title, output, workspace, placement override,
    visibility (Visible/Minimized), presentation (Normal/Maximized/Fullscreen),
    lifecycle (Open/CloseRequested/Closing), float geometry, pending geometry,
    committed geometry, size constraints (min/max), tiling slot, sticky, always_on_top,
    decorated, modal, urgent, opacity. Maps to future epic e02.
  - Workspace state model: id, name, output, mode (Tiling/Floating), layout
    (Master/Dwindle/EqualSplit), window membership (tiling order), focus history
    (MRU), empty/persistent behavior, per-layout state (master ratio/count/position,
    dwindle tree, equal orientation). Maps to future epic e02.
  - Output model: id, name, geometry, usable_area (minus exclusive zones), active
    workspace, previous workspace. Maps to future epic e02.
  - Workspace switching and moving windows between workspaces. Maps to future epic e02.
  - Close protocol: Open → CloseRequested → Closing with client acknowledgement or
    timeout. Maps to future epic e02.
  - Integration of new state model with the existing master-stack tiler and
    floating windows. Maps to future epic e02.

out_of_scope:
  - Animations (Phase 4): deferred. Window geometry and focus must be stable
    before any interpolation or transition work.
  - Floating snap zones and Windows 11 snap behaviour: deferred. Not part of
    the Phase 2 state model.
  - Tacit native integration (Phase 5): deferred. Depends on state queries
    (window, workspace, output, focus) that this phase builds.
  - Xwayland support: deferred. Optional, behind a build/runtime option.
  - Multi-monitor hotplug beyond existing Phase 1 output tracking: deferred.
    Phase 1 already covers outputs, modes, scale, transform, positions.

constraints:
  - Rust 2024; dependencies: smithay 0.7, wayland-server 0.31, winit (dev only), mlua.
    No new dependencies introduced in this initiative.
  - Lua-only configuration at ~/.config/eswm/config.lua; no JSON config path.
  - DRM/libseat is the default runtime path; Winit is the nested dev backend
    only.
  - Never copy Pinnacle source, assets, or distinctive implementation
    (reference only).
  - Preflight (cargo clippy && cargo test && cargo build) must be green before
    forward work.
  - eswm easy brand: short, grep-unique names; no clever abbreviations.

success_criteria:
  - One workspace per output; windows are assignable to workspaces.
  - Workspace switch moves focus and visible windows to the new workspace.
  - Moving a window between workspaces updates both workspace membership and
    window state.
  - Close protocol: client acknowledges close request or timeout forces removal.
  - Existing tiling and floating behavior continues to work with the new state
    model.
  - Layout switching keeps tiling order and each layout's saved state.
  - cargo test passes; preflight green.

references:
  - notes/roadmap.md — Phase 2 window and workspace model
  - notes/status.md
  - notes/tacit-integration.md
  - src/wm.rs — existing window management
  - src/control.rs — existing control plane
