core_value: |
  eswm provides two distinct compositor modes — tiling and floating — per output,
  with tiling offering master-stack and dwindle layouts and floating implementing
  Windows 11 snap behaviour, so every window is either managed automatically or
  placed exactly where the user puts it.

summary: |
  e03 introduces the layout engine and Windows 11 floating mode on top of the
  completed window/workspace state model (e02). Layout mode is per output. Tiling
  mode auto-arranges windows via master-stack or dwindle. Floating mode supports
  edge/corner snap, drag-to-top maximize, and snap restore. Layout toggle uses
  Super+`; Super+Space is reserved for the app launcher.

in_scope:
  - Per-output LayoutMode field on Output; tiling or floating, independent per output. Maps to future epic e03.
  - Layout toggle keybind Super+` cycling per-output between tiling and floating. Maps to future epic e03.
  - Tiling layouts: master-stack (existing 3/5 split) and dwindle (recursive binary split). Maps to future epic e03.
  - Floating mode snap zones: left/right half, top half, bottom half, quarter corners, drag-to-top maximize. Maps to future epic e03.
  - Snap restore: dragging a snapped window away from its snap edge restores its pre-snap rect. Maps to future epic e03.
  - Visible focus border drawn around focused window in DRM render path (replaces winit green hack). Maps to future epic e03.

out_of_scope:
  - Workspace animations / transitions (deferred to Phase 4): geometry and focus must be stable before interpolation.
  - Tacit native control integration (deferred to Phase 5): depends on state model and layout being stable.
  - Xwayland support (deferred): optional, behind a build/runtime option.
  - Multi-output hotplug beyond existing Phase 1 output tracking: already covered.
  - Super+Space app launcher (deferred): reserved keybind only; no launcher implementation in this epic.

constraints:
  - Rust 2024; dependencies: smithay 0.7, wayland-server 0.31, winit (dev only), mlua. No new dependencies.
  - Lua-only configuration at ~/.config/eswm/config.lua; no JSON config path.
  - DRM/libseat is the default runtime path; winit backend removed.
  - Never copy Pinnacle source, assets, or distinctive implementation (reference only).
  - Preflight (cargo clippy && cargo test && cargo build) must be green before forward work.
  - eswm easy brand: short, grep-unique names; no clever abbreviations.

success_criteria:
  - Each output independently runs tiling or floating mode.
  - Super+` toggles layout mode on the focused output.
  - Tiling mode arranges windows via master-stack or dwindle; no manual placement.
  - Floating mode snaps windows to edges/corners and maximizes on drag-to-top.
  - Dragging a snapped window away restores its pre-snap rect.
  - Focused window has a visible border in the DRM render path.
  - cargo test passes; preflight green.

references:
  - notes/roadmap.md — Phase 3 tiling and floating management
  - specs/product/SCOPE_LATEST.yaml (e02, completed) — window and workspace model
  - src/wm.rs — existing WindowManager, LayoutMode, WindowMode
  - src/udev.rs — existing keybind dispatch and DRM render loop
