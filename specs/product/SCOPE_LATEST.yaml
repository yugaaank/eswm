core_value: |
  eswm provides two tiling layouts per output — master-stack and dwindle — so
  windows are arranged automatically without manual placement.

summary: |
  e03 adds a per-output layout mode and a dwindle tiling layout on top of the
  completed window/workspace state model (e02). Each output independently runs
  master-stack (existing 3/5 split) or dwindle (recursive binary split). A
  keybind toggles the layout on the focused output. Floating snap behaviour is
  deferred; this epic covers tiling layouts only.

in_scope:
  - Per-output LayoutMode field on Output: master-stack or dwindle. Maps to future epic e03.
  - Layout toggle keybind cycling per-output between master-stack and dwindle. Maps to future epic e03.
  - Dwindle layout: recursive binary split where each new window splits the largest leaf. Maps to future epic e03.
  - Wire dwindle into arrange_output when output layout mode is dwindle. Maps to future epic e03.
  - Unit tests for dwindle layout: non-overlapping rects, full coverage of output, correct splits. Maps to future epic e03.

out_of_scope:
  - Floating snap zones / Windows 11 snap behaviour: deferred. Not part of tiling layouts.
  - Workspace animations / transitions (Phase 4): deferred.
  - Tacit native control integration (Phase 5): deferred.
  - Xwayland support: deferred.
  - Floating mode as a layout: deferred (no per-output floating toggle in this epic).

constraints:
  - Rust 2024; dependencies: smithay 0.7, wayland-server 0.31, winit (dev only), mlua. No new dependencies.
  - Lua-only configuration at ~/.config/eswm/config.lua; no JSON config path.
  - DRM/libseat is the default runtime path; winit backend removed.
  - Never copy Pinnacle source, assets, or distinctive implementation (reference only).
  - Preflight (cargo clippy && cargo test && cargo build) must be green before forward work.
  - eswm easy brand: short, grep-unique names; no clever abbreviations.

success_criteria:
  - Each output independently runs master-stack or dwindle layout.
  - Layout toggle keybind switches the focused output's layout.
  - Dwindle arranges windows with non-overlapping rects covering the output work area.
  - Master-stack continues to work unchanged.
  - cargo test passes; preflight green.

references:
  - notes/roadmap.md — Phase 3 tiling and floating management
  - specs/product/SCOPE_LATEST.yaml (e02, completed) — window and workspace model
  - src/wm.rs — existing WindowManager, LayoutMode, arrange_output
  - src/udev.rs — existing keybind dispatch
