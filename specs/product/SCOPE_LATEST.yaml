core_value: |
  e11-proper-de Phase 0 makes eswm the session that portals and file pickers
  belong to. Without session environment export, GTK/Qt file choosers open in a
  different running compositor even when the app itself is on eswm.

summary: |
  This scope covers only Phase 0 of the proper-DE parity plan: make the
  compositor identify itself as the active Wayland session to the user's
  systemd/D-Bus environment, ship a portal configuration that selects a
  compatible backend, and document how to launch eswm that way.
  Phase 0 fixes a user-visible bug — file pickers opening in Hyprland — before
  any new Wayland protocol work starts. It is deliberately small so the risky
  part (touching a shared user session environment) can be guarded and
  verified on its own.
  Later phases (Tacit shell blockers, capture/sharing, protocol completeness,
  visual polish) are explicit deferrals, not silent expectations.

in_scope:
  - >-
    Session identity export with graceful degradation: set WAYLAND_DISPLAY,
    XDG_CURRENT_DESKTOP, XDG_SESSION_TYPE and XDG_SESSION_DESKTOP for the
    compositor and its spawned children, push them to systemd user and D-Bus
    activation environments when available, and clean up only values eswm set.
    Maps to e11s01.
  - >-
    Portal selection files and launch documentation: install an eswm portal
    config that defaults to the GTK backend and does not claim ScreenCast, plus
    TTY launch guidance covering the environment export. Maps to e11s02.

out_of_scope:
  - >-
    Phase 1 Tacit shell blockers (ext_session_lock_v1, idle inhibit/notify,
    foreign toplevel, control/event parity): deferred. Session identity must be
    correct first, otherwise those protocols attach to the wrong session.
  - >-
    Phase 2 screen capture, PipeWire screencast and portal ScreenCast: deferred.
    The portal config intentionally does not claim ScreenCast until a capture
    protocol exists.
  - >-
    Phase 3 protocol completeness (fractional scale, presentation time, pointer
    constraints, shortcuts inhibit, output management, IME, tablet,
    security_context): deferred to separate stories after Phase 1.
  - >-
    Phase 4 visual DE polish (opacity rules, animations, blur, overview):
    deferred. Correctness and session integration come first.
  - >-
    Distro packaging, CI distro matrix and Nix flake: deferred to the separate
    e12-distro-agnostic-packaging epic proposed by the distro plan.
  - >-
    Xwayland DISPLAY export and multi-compositor conflict arbitration beyond
    documented guards and an opt-out: deferred. Xwayland is not present today,
    and resolving two live compositors needs an explicit product decision.

constraints:
  - >-
    Rust 2024 with smithay 0.7, wayland-server 0.31 and mlua; no new Rust crate
    dependencies for Phase 0. External tools are optional and must degrade to a
    warning when absent (ADR-0002: DRM/libseat is the only runtime path).
  - >-
    Never clobber environment values a user or another session changed after
    eswm set them; provide a clear opt-out following the observed Hyprland
    pattern.
  - >-
    Lua-only configuration at ~/.config/eswm/config.lua; no JSON config path.
  - >-
    Do not copy code from cosmic-comp or Hyprland; they are behavioral
    references only (AGENTS.md clean-room rule).
  - >-
    Preflight (cargo clippy --all-targets && cargo test && cargo build) and
    spec-lint must be green before any merge.
  - >-
    eswm easy brand: short, grep-unique names; no clever abbreviations.

success_criteria:
  - >-
    From a fresh eswm TTY session, a GTK/Qt file picker stays in eswm instead
    of opening in another compositor (operator live UAT; cannot be run from an
    existing Wayland/X11 session).
  - >-
    systemctl --user show-environment reports the eswm session variables while
    eswm is running; D-Bus activation environment receives the same variables.
  - >-
    On a machine without systemd or dbus-update-activation-environment, eswm
    still starts and logs a warning instead of failing.
  - >-
    On clean shutdown, only environment entries eswm owns are removed; values
    changed by the user afterwards survive.
  - >-
    An eswm portal config is shipped/installed with default=gtk and no
    ScreenCast claim, and the launch docs describe the TTY environment flow.
  - >-
    All 2 Phase 0 stories are implemented with TDD tasks, spec-lint is green,
    and preflight passes.

references:
  - specs/epics/e11-proper-de/PROPER-DE-PLAN_LATEST.md — Phase 0 and first tickets
  - specs/state.yaml — current session and handoff context
  - specs/adr/ADR-0002-drm-libseat-only-runtime.md — runtime boundary
  - src/main.rs — current spawn-time environment handling
  - cosmic-comp/src/dbus/mod.rs and src/systemd.rs — behavioral reference only
  - Hyprland/src/Compositor.cpp — behavioral reference only
  - /usr/share/xdg-desktop-portal/hyprland-portals.conf — observed portal config shape
